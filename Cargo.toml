[workspace]
resolver = "3"
members = ["crates/xl-span", "crates/xl-diag", "crates/xl-lexer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JoaoGaValentim/xlang"
publish = false

[workspace.dependencies]
xl-span = { path = "crates/xl-span" }
xl-diag = { path = "crates/xl-diag" }
unicode-ident = "1.0"
insta = "1"
proptest = "1"
